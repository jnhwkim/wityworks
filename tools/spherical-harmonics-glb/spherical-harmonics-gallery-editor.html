<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spherical Harmonics GLB Layout Editor</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #11151a; color: #e8edf2; overflow: hidden; }
    #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    aside { background: #1a2027; border-right: 1px solid #2d3742; padding: 18px; overflow-y: auto; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p, label { color: #aeb9c5; font-size: 12px; line-height: 1.45; }
    .actions { display: grid; gap: 8px; margin: 16px 0; }
    .tool-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 14px; }
    button, .file-label { border: 1px solid #41505f; border-radius: 6px; background: #26313d; color: #edf3f9; padding: 9px 10px; cursor: pointer; font: inherit; font-size: 13px; text-align: center; }
    button:hover, .file-label:hover { background: #344454; }
    input[type=file] { display: none; }
    #object-list { display: grid; gap: 3px; margin: 10px 0 18px; }
    .object { background: transparent; border: 1px solid transparent; border-radius: 5px; color: #c7d2dd; cursor: pointer; padding: 7px; text-align: left; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .object:hover { background: #26313d; }
    .object.active { background: #174862; border-color: #2b789d; color: #fff; }
    .tool.active { background: #17638a; border-color: #55c8ef; color: #fff; }
    #position { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    #position label { display: grid; gap: 3px; }
    input[type=number] { background: #111820; border: 1px solid #41505f; border-radius: 4px; color: #fff; min-width: 0; padding: 6px; }
    #status { min-height: 32px; color: #81d4fa; font-size: 12px; }
    main { position: relative; min-width: 0; background: #11151a; }
    canvas { display: block; position: absolute; background: #faf9f6; }
    #help { position: absolute; top: 14px; left: 14px; background: rgb(17 21 26 / 85%); border: 1px solid #37424d; border-radius: 6px; color: #c9d3dd; font-size: 12px; padding: 9px 11px; pointer-events: none; }
    #render-frame { position: absolute; border: 2px dashed #55c8ef; box-shadow: 0 0 0 1px rgb(0 0 0 / 35%); pointer-events: none; }
    #render-frame span { position: absolute; top: -24px; left: -2px; background: #126181; color: #effbff; font: 11px ui-monospace, monospace; padding: 4px 6px; }
    @media (max-width: 720px) { #app { grid-template-columns: 236px 1fr; } aside { padding: 12px; } }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>GLB Layout Editor</h1>
      <p>오브젝트를 선택한 뒤 뷰포트의 화살표 핸들을 드래그하거나 좌표를 입력하세요. 이동만 변경되며 회전과 크기는 유지됩니다.</p>
      <div class="actions">
        <label class="file-label" for="file-input">다른 GLB 열기</label>
        <input id="file-input" type="file" accept=".glb,model/gltf-binary">
        <button id="reset-view-button" type="button">초기 카메라 위치</button>
        <button id="save-button" type="button">이동한 GLB 저장</button>
        <button id="reload-saved-button" type="button" disabled>방금 저장한 GLB 다시 열기</button>
        <button id="render-png-button" type="button">렌더 이미지 저장 (PNG)</button>
      </div>
      <div id="status">기본 갤러리를 불러오는 중…</div>
      <label>편집 도구</label>
      <div class="tool-buttons">
        <button id="translate-tool" class="tool active" type="button">이동</button>
        <button id="rotate-tool" class="tool" type="button">회전</button>
      </div>
      <label>렌더 스타일</label>
      <div class="tool-buttons">
        <button id="color-style" class="tool" type="button">컬러</button>
        <button id="outline-style" class="tool active" type="button">카툰 윤곽선</button>
      </div>
      <label>오브젝트</label>
      <div id="object-list"></div>
      <label>선택한 오브젝트의 위치</label>
      <div id="position">
        <label>X<input id="position-x" type="number" step="0.05" disabled></label>
        <label>Y<input id="position-y" type="number" step="0.05" disabled></label>
        <label>Z<input id="position-z" type="number" step="0.05" disabled></label>
      </div>
      <label for="keyboard-step">키보드 이동값 (1–100)</label>
      <input id="keyboard-step" type="number" min="1" max="100" value="1" step="1">
      <p>←/→: X 이동 · ↑/↓: Y 이동 · Z/X: Z축 이동<br>한글 입력 상태에서도 동작합니다.</p>
    </aside>
    <main>
      <canvas id="viewport"></canvas>
      <div id="help">클릭: 선택 · 화살표 드래그: 이동 · 오른쪽 드래그: 시점 회전 · 휠: 확대</div>
      <div id="render-frame"><span>PNG RENDER · 1440 × 810 · 16:9</span></div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/loaders/GLTFLoader.js';
    import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/exporters/GLTFExporter.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/controls/TransformControls.js';

    const canvas = document.querySelector('#viewport');
    const main = document.querySelector('main');
    const status = document.querySelector('#status');
    const list = document.querySelector('#object-list');
    const resetViewButton = document.querySelector('#reset-view-button');
    const saveButton = document.querySelector('#save-button');
    const reloadSavedButton = document.querySelector('#reload-saved-button');
    const translateTool = document.querySelector('#translate-tool');
    const rotateTool = document.querySelector('#rotate-tool');
    const colorStyle = document.querySelector('#color-style');
    const outlineStyle = document.querySelector('#outline-style');
    const inputs = ['x', 'y', 'z'].map(axis => document.querySelector('#position-' + axis));
    const keyboardStep = document.querySelector('#keyboard-step');
    const renderFrame = document.querySelector('#render-frame');
    const RENDER_WIDTH = 1440;
    const RENDER_HEIGHT = 810;
    const RENDER_ASPECT = RENDER_WIDTH / RENDER_HEIGHT;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0xfaf9f6, 1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, RENDER_ASPECT, 0.1, 1000);
    camera.position.set(0, 0, 25);
    const orbit = new OrbitControls(camera, canvas);
    orbit.target.set(0, 0, 0);
    orbit.enableDamping = true;
    const transform = new TransformControls(camera, canvas);
    transform.setMode('translate');
    transform.space = 'world';
    transform.addEventListener('dragging-changed', event => { orbit.enabled = !event.value; });
    transform.addEventListener('objectChange', updateInputs);
    scene.add(transform);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x24313b, 2.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
    keyLight.position.set(-4, 7, 12);
    scene.add(keyLight);
    const gallery = new THREE.Group();
    gallery.name = 'Spherical harmonics gallery';
    scene.add(gallery);
    const loader = new GLTFLoader();
    const exporter = new GLTFExporter();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let selectable = [];
    let selected = null;
    let activeTool = 'translate';
    let activeRenderStyle = 'outline';
    let displayWidth = 0;
    let displayHeight = 0;
    let lastSavedGlbUrl = null;
    const initialCameraPosition = new THREE.Vector3();
    const initialCameraTarget = new THREE.Vector3();
    const originalMaterials = new WeakMap();
    const outlineMaterials = new Set();

    function setStatus(message) { status.textContent = message; }
    function setTool(mode) {
      activeTool = mode;
      transform.setMode(mode);
      translateTool.classList.toggle('active', mode === 'translate');
      rotateTool.classList.toggle('active', mode === 'rotate');
      setStatus(mode === 'rotate' ? '회전 도구: 컬러 링을 드래그하세요.' : '이동 도구: 화살표 핸들을 드래그하세요.');
    }
    function createOutlineMaterial() {
      const material = new THREE.ShaderMaterial({
        uniforms: {
          outlineWidth: { value: 2.2 },
          resolution: { value: new THREE.Vector2(1440, 810) },
          outlineColor: { value: new THREE.Color(0x55503f) }
        },
        vertexShader: `
          uniform float outlineWidth;
          uniform vec2 resolution;
          void main() {
            vec4 clipPosition = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            vec3 viewNormal = normalize(normalMatrix * normal);
            vec2 screenNormal = normalize(viewNormal.xy + vec2(0.00001));
            clipPosition.xy += screenNormal * outlineWidth * 2.0 * clipPosition.w / resolution;
            gl_Position = clipPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 outlineColor;
          void main() { gl_FragColor = vec4(outlineColor, 1.0); }
        `,
        side: THREE.BackSide,
        depthWrite: true,
        depthTest: true
      });
      outlineMaterials.add(material);
      return material;
    }
    function removeCartoonOutline(mesh) {
      mesh.children.filter(child => child.userData.cartoonOutline === true).forEach(child => mesh.remove(child));
    }
    function applyRenderStyle(style, announce) {
      activeRenderStyle = style;
      colorStyle.classList.toggle('active', style === 'color');
      outlineStyle.classList.toggle('active', style === 'outline');
      gallery.traverse(mesh => {
        if (!mesh.isMesh || mesh.userData.cartoonOutline === true) return;
        if (!originalMaterials.has(mesh)) originalMaterials.set(mesh, mesh.material);
        removeCartoonOutline(mesh);
        mesh.material = originalMaterials.get(mesh);
        if (style === 'color') {
          return;
        }
        const outline = new THREE.Mesh(mesh.geometry, createOutlineMaterial());
        outline.name = 'Cartoon_outline_shader';
        outline.userData.cartoonOutline = true;
        mesh.add(outline);
      });
      if (announce) setStatus(style === 'outline' ? 'WebGL 카툰 윤곽선을 적용했습니다.' : '원래 컬러 스타일을 적용했습니다.');
    }
    function setCameraAspect(aspect) {
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
    }
    function rememberInitialView() {
      initialCameraPosition.copy(camera.position);
      initialCameraTarget.copy(orbit.target);
    }
    function isEditorCamera(object) {
      return Boolean(object && object.isCamera && object.userData.layoutEditorCamera === true);
    }
    function restoreSavedCamera() {
      let savedCamera = null;
      gallery.traverse(object => {
        if (!savedCamera && isEditorCamera(object)) savedCamera = object;
      });
      const hasEditorPose = Boolean(savedCamera);
      if (!savedCamera) {
        gallery.traverse(object => {
          if (!savedCamera && object.isCamera) savedCamera = object;
        });
      }
      if (!savedCamera || !savedCamera.isCamera) return false;
      gallery.updateMatrixWorld(true);
      savedCamera.getWorldPosition(camera.position);
      savedCamera.getWorldQuaternion(camera.quaternion);
      // The editor is always the requested 60-degree pinhole camera.
      camera.fov = 60;
      const savedTarget = savedCamera.userData.layoutEditorTarget;
      const legacySourcePose = hasEditorPose && Array.isArray(savedTarget) &&
        savedTarget.length === 3 && camera.position.distanceToSquared(new THREE.Vector3(0, 0, 24)) < 0.0001 &&
        new THREE.Vector3().fromArray(savedTarget).lengthSq() < 0.0001;
      if (hasEditorPose && !legacySourcePose && Array.isArray(savedTarget) && savedTarget.length === 3) {
        orbit.target.fromArray(savedTarget);
      } else {
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        // The original GLB camera is at (0, 0, 24) and looks at the origin.
        // Its source view was orthographic; this closer position matches the
        // former editing view after converting to a 60-degree pinhole camera.
        orbit.target.copy(camera.position).addScaledVector(forward, Math.max(camera.position.length(), 10));
        camera.position.lerp(orbit.target, 0.40);
      }
      setCameraAspect(RENDER_ASPECT);
      orbit.update();
      rememberInitialView();
      return true;
    }
    function saveCameraPoseToGallery() {
      let savedCamera = null;
      gallery.traverse(object => {
        if (!savedCamera && isEditorCamera(object)) savedCamera = object;
      });
      if (!savedCamera) {
        savedCamera = new THREE.PerspectiveCamera(60, RENDER_ASPECT, 0.1, 1000);
        savedCamera.name = 'Layout_editor_camera';
        gallery.add(savedCamera);
      }
      savedCamera.position.copy(camera.position);
      savedCamera.quaternion.copy(camera.quaternion);
      savedCamera.fov = camera.fov;
      savedCamera.near = camera.near;
      savedCamera.far = camera.far;
      savedCamera.userData.layoutEditorCamera = true;
      savedCamera.userData.layoutEditorTarget = orbit.target.toArray();
      savedCamera.updateProjectionMatrix();
      savedCamera.updateMatrixWorld();
    }
    function frameLoadedGallery() {
      const bounds = new THREE.Box3().setFromObject(gallery);
      if (bounds.isEmpty()) return;
      const center = bounds.getCenter(new THREE.Vector3());
      const size = bounds.getSize(new THREE.Vector3());
      // Fit the bounds through a 60-degree pinhole camera with a small border.
      const tangent = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const distanceForHeight = size.y / 2 / tangent;
      const distanceForWidth = size.x / 2 / (tangent * RENDER_ASPECT);
      const cameraDistance = Math.max(distanceForHeight, distanceForWidth) * 1.14 + size.z / 2;
      orbit.target.copy(center);
      camera.position.set(center.x, center.y, center.z + Math.max(cameraDistance, 1));
      setCameraAspect(RENDER_ASPECT);
      camera.lookAt(center);
      orbit.update();
      rememberInitialView();
    }
    function fitRenderFrame(width, height) {
      const maximumWidth = width * 0.96;
      const maximumHeight = height * 0.90;
      const maximumFrameWidth = Math.min(maximumWidth, maximumHeight * RENDER_ASPECT);
      // Keep the editor's displayed canvas at an exact integer 16:9 size too.
      const frameWidth = Math.floor(maximumFrameWidth / 16) * 16;
      const frameHeight = frameWidth / 16 * 9;
      return { x: Math.floor((width - frameWidth) / 2), y: Math.floor((height - frameHeight) / 2),
               width: frameWidth, height: frameHeight };
    }
    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }
    function downloadDataUrl(dataUrl, filename) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
    }
    function objectLabel(object, index) {
      return String(index + 1).padStart(2, '0') + ' · ' + (object.name || ('Object ' + (index + 1)));
    }
    function updateInputs() {
      const enabled = selected !== null;
      inputs.forEach((input, index) => {
        input.disabled = !enabled;
        if (enabled) input.value = selected.position.getComponent(index).toFixed(2);
      });
    }
    function select(object) {
      selected = object;
      transform.attach(object);
      [...list.children].forEach(button => button.classList.toggle('active', button.object === object));
      updateInputs();
      setStatus('선택됨: ' + object.userData.editorLabel);
    }
    function rebuildList() {
      selectable = [];
      gallery.traverse(object => {
        if (object.isMesh && object.userData.cartoonOutline !== true) selectable.push(object);
      });
      list.replaceChildren();
      selectable.forEach((object, index) => {
        const button = document.createElement('button');
        button.className = 'object';
        button.type = 'button';
        button.textContent = objectLabel(object, index);
        object.userData.editorLabel = button.textContent;
        button.object = object;
        button.addEventListener('click', () => select(object));
        list.append(button);
      });
      if (selectable.length) select(selectable[0]);
    }
    function clearGallery() {
      transform.detach();
      selected = null;
      while (gallery.children.length) gallery.remove(gallery.children[0]);
      updateInputs();
    }
    function loadGltf(url, title) {
      setStatus(title + ' 불러오는 중…');
      loader.load(url, gltf => {
        clearGallery();
        gallery.add(gltf.scene);
        const cameraRestored = restoreSavedCamera();
        if (!cameraRestored) frameLoadedGallery();
        applyRenderStyle(activeRenderStyle, false);
        rebuildList();
        setStatus(title + ': ' + selectable.length + '개 오브젝트' +
                  (cameraRestored ? ' · 저장한 카메라 포즈 복원됨' : ''));
      }, undefined, error => {
        console.error(error);
        setStatus('GLB를 열지 못했습니다. HTTP 서버에서 페이지를 열었는지 확인하세요.');
      });
    }
    function resize() {
      const displayFrame = fitRenderFrame(main.clientWidth, main.clientHeight);
      canvas.style.left = displayFrame.x + 'px';
      canvas.style.top = displayFrame.y + 'px';
      canvas.style.width = displayFrame.width + 'px';
      canvas.style.height = displayFrame.height + 'px';
      renderFrame.style.left = displayFrame.x + 'px';
      renderFrame.style.top = displayFrame.y + 'px';
      renderFrame.style.width = displayFrame.width + 'px';
      renderFrame.style.height = displayFrame.height + 'px';
      if (displayWidth !== displayFrame.width || displayHeight !== displayFrame.height) {
        displayWidth = displayFrame.width;
        displayHeight = displayFrame.height;
        renderer.setSize(displayWidth, displayHeight, false);
      }
      outlineMaterials.forEach(material => material.uniforms.resolution.value.set(displayWidth, displayHeight));
      setCameraAspect(RENDER_ASPECT);
    }
    function render() {
      resize();
      orbit.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    canvas.addEventListener('pointerdown', event => {
      if (transform.dragging || event.button !== 0) return;
      const bounds = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(selectable, false)[0];
      if (hit) select(hit.object);
    });
    inputs.forEach((input, index) => input.addEventListener('change', () => {
      if (!selected || !Number.isFinite(Number(input.value))) return;
      selected.position.setComponent(index, Number(input.value));
      selected.updateMatrixWorld();
      updateInputs();
    }));
    document.addEventListener('keydown', event => {
      const editable = event.target.matches('input, textarea, select, [contenteditable=true]');
      if (editable || !selected) return;
      const step = Math.max(1, Math.min(100, Number(keyboardStep.value) || 1));
      const offset = new THREE.Vector3();
      if (event.code === 'ArrowLeft') offset.x = -step;
      if (event.code === 'ArrowRight') offset.x = step;
      if (event.code === 'ArrowUp') offset.y = step;
      if (event.code === 'ArrowDown') offset.y = -step;
      if (event.code === 'KeyZ') offset.z = step;
      if (event.code === 'KeyX') offset.z = -step;
      if (offset.lengthSq() === 0) return;
      event.preventDefault();
      selected.position.add(offset);
      selected.updateMatrixWorld();
      updateInputs();
    });
    document.querySelector('#file-input').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      loadGltf(url, file.name);
    });
    reloadSavedButton.addEventListener('click', () => {
      if (lastSavedGlbUrl) loadGltf(lastSavedGlbUrl, '방금 저장한 GLB');
    });
    translateTool.addEventListener('click', () => setTool('translate'));
    rotateTool.addEventListener('click', () => setTool('rotate'));
    colorStyle.addEventListener('click', () => applyRenderStyle('color', true));
    outlineStyle.addEventListener('click', () => applyRenderStyle('outline', true));
    resetViewButton.addEventListener('click', () => {
      if (!gallery.children.length) return;
      camera.position.copy(initialCameraPosition);
      orbit.target.copy(initialCameraTarget);
      setCameraAspect(RENDER_ASPECT);
      orbit.update();
      setStatus('초기 카메라 위치로 복원했습니다.');
    });
    saveButton.addEventListener('click', () => {
      if (!gallery.children.length) return;
      setStatus('GLB 내보내는 중…');
      const styleBeforeExport = activeRenderStyle;
      applyRenderStyle('color', false);
      saveCameraPoseToGallery();
      exporter.parse(gallery, result => {
        const blob = new Blob([result], { type: 'model/gltf-binary' });
        if (lastSavedGlbUrl) URL.revokeObjectURL(lastSavedGlbUrl);
        lastSavedGlbUrl = URL.createObjectURL(blob);
        reloadSavedButton.disabled = false;
        downloadBlob(blob, 'spherical-harmonics-cover.glb');
        setStatus('저장됨: spherical-harmonics-cover.glb (카메라 포즈 포함)');
        if (styleBeforeExport === 'outline') applyRenderStyle('outline', false);
      }, error => {
        console.error(error);
        if (styleBeforeExport === 'outline') applyRenderStyle('outline', false);
        setStatus('GLB 내보내기에 실패했습니다.');
      }, { binary: true, onlyVisible: true });
    });
    document.querySelector('#render-png-button').addEventListener('click', () => {
      if (!gallery.children.length) return;
      const previousPixelRatio = renderer.getPixelRatio();
      transform.visible = false;
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT, false);
      setCameraAspect(RENDER_WIDTH / RENDER_HEIGHT);
      renderer.render(scene, camera);
      const imageData = canvas.toDataURL('image/png');
      renderer.setPixelRatio(previousPixelRatio);
      renderer.setSize(displayWidth, displayHeight, false);
      setCameraAspect(RENDER_ASPECT);
      transform.visible = true;
      downloadDataUrl(imageData, 'spherical_harmonics_gallery_render.png');
      setStatus('저장됨: spherical_harmonics_gallery_render.png');
    });
    loadGltf('../../static/img/blog/spherical-harmonics-cover.glb', '기본 갤러리');
    render();
  </script>
</body>
</html>
